name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    name: Start Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360 # أقصى مدة مسموحة هي 6 ساعات

    steps:
      - name: Download & Extract Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          
      - name: Authenticate Ngrok
        run: .\ngrok.exe config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
        
      - name: Enable RDP (Remote Desktop)
        run: | 
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          
      - name: Create RDP User Credentials
        run: |
          net user runneradmin "WindowsPassword123!" 
          # اليوزر الافتراضي هو runneradmin والباسورد أعلاه
          
      - name: Start Ngrok Tunnel
        run: |
          Start-Process Powershell -ArgumentList '-Noprofile -ExecutionPolicy Bypass -Command ".\ngrok.exe tcp 3389"'
          Start-Sleep -Seconds 5
          
      - name: Print RDP Connect Details
        run: |
          $tunnel = Invoke-WebRequest -Uri http://127.0.0.1:4040/api/tunnels -UseBasicParsing | ConvertFrom-Json
          $url = $tunnel.tunnels[0].public_url
          Write-Host "=========================================="
          Write-Host "تم تشغيل الـ RDP بنجاح!"
          Write-Host "IP / Address: $url"
          Write-Host "Username: runneradmin"
          Write-Host "Password: WindowsPassword123!"
          Write-Host "=========================================="
          
      - name: Keep Session Alive
        run: Start-Sleep -Seconds 21600 # يبقي الجلسة فعالة لمدة 6 ساعات
        
