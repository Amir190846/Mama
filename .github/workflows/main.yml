name: Windows

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configure Some RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Create RDP User with Static Password
        run: |
          $Password = "Admin@123"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force
          New-LocalUser -Name "Admin1" -Password $SecurePassword
          Add-LocalGroupMember -Group "Administrators" -Member "Admin1"
          if ($?) { Write-Host "RDP user created successfully" } else { Write-Error "User creation failed" }

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.48.2-amd64.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

      - name: Establish Tailscale Connection
        run: |
          $Env:TAILSCALE_AUTHKEY = "${{ secrets.TAILSCALE_AUTHKEY }}"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$Env:TAILSCALE_AUTHKEY --reset
          Start-Sleep -Seconds 10
          $ip = (tailscale ip -4)
          if (-not $ip) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          Write-Host "Tailscale IP: $ip"

      - name: Verify RDP Accessibility
        run: |
          $port = 3389
          $connection = Test-NetConnection -ComputerName localhost -Port $port
          if ($connection.TcpTestSucceeded) {
            Write-Host "RDP is listening on port $port"
          } else {
            Write-Host "RDP connection test on port $port failed"
          }

      - name: Network Connection
        run: |
          $TailscaleIP = (tailscale ip -4)
          Write-Host "TAILSCALE IP: $TailscaleIP"
          Write-Host "Username: Admin1"
          Write-Host "Password: Admin@123"
          # Keep Action running. Max execution time is 6 hours on GitHub Free
          while ($true) {
            Start-Sleep -Seconds 300
          }
